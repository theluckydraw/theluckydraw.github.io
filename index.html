<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#2a0d4a; --bg2:#0b0418;
    --red1:#ff3b4e; --red2:#c3102b; --red3:#6e0718;
    --gold1:#fff1a8; --gold2:#f7c843; --gold3:#b9801c;
    --ivory:#fffaf0; --ink:#1b0b24; --lime:#7dff6b;
    --itemH:76px; --digitH:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(900px 600px at 15% 10%, rgba(255,79,216,.22), transparent 60%),
      radial-gradient(800px 600px at 90% 80%, rgba(62,240,255,.16), transparent 60%),
      radial-gradient(1200px 900px at 50% 40%, var(--bg1), var(--bg2));
    background-attachment:fixed;background-color:var(--bg2);
    color:#fff;font-family:Poppins,system-ui,sans-serif;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;user-select:none;
  }
  .sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .sparkles i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px currentColor;opacity:0;animation:twinkle 4s infinite}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}

  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 26px;z-index:5}
  .logo{font-family:Bungee,sans-serif;font-size:20px;letter-spacing:.04em;
    background:linear-gradient(var(--gold1),var(--gold2) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 #7a3b00) drop-shadow(0 0 14px rgba(247,200,67,.45))}
  .pills{display:flex;gap:10px;align-items:center}
  .pill{font-family:inherit;font-size:13px;color:#e9dcff;cursor:pointer;
    background:linear-gradient(#4a1d86,#2b0f55);border:2px solid var(--gold2);border-radius:999px;padding:6px 16px 6px 14px;
    box-shadow:0 0 0 2px #2b0f55,0 6px 16px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25)}
  .pill{white-space:nowrap}
  .pill b{font-family:Bungee,sans-serif;font-weight:400;color:#fff;margin-right:5px}
  .pill:hover{filter:brightness(1.15)}
  .reset-pill{color:#ffb3ba;border-color:#ff8a95}
  .icon-pill{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:16px}

  .stage{position:relative;z-index:1;padding:76px 16px 24px;display:flex;justify-content:center;align-items:center;gap:36px}
  /* prizes */
  .prizes{width:250px;flex:none;border-radius:22px;padding:18px 14px 14px;
    background:linear-gradient(#3a1670,#1c0938);border:3px solid var(--gold2);box-shadow:0 0 0 3px var(--gold3),0 30px 60px -20px rgba(0,0,0,.8),0 0 40px rgba(255,79,216,.18)}
  .prizes h3{font-family:Bungee,sans-serif;font-weight:400;font-size:20px;text-align:center;margin-bottom:4px;
    background:linear-gradient(var(--gold1),var(--gold2) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .prizes p{font-size:11px;text-align:center;color:#c9b6ef;margin-bottom:12px}
  .prize-list{display:flex;flex-direction:column;gap:9px}
  .prize{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;font-family:Poppins,sans-serif;
    padding:10px 12px;border-radius:14px;color:#fff;background:linear-gradient(#2b0f55,#1a0736);border:2px solid rgba(247,200,67,.35);
    transition:transform .15s,border-color .15s,box-shadow .15s,background .15s}
  .prize:hover{border-color:var(--gold2);transform:translateX(3px)}
  .prize .ico{font-size:24px;width:34px;text-align:center;flex:none}
  .prize .nm{font-weight:700;font-size:14px;line-height:1.2;flex:1}
  .prize .ct{font-family:Bungee,sans-serif;font-size:11px;color:var(--gold2);background:rgba(0,0,0,.35);border-radius:999px;padding:2px 8px;flex:none}
  .prize.sel{background:linear-gradient(var(--red1),var(--red2) 60%,var(--red3));border-color:var(--gold1);
    box-shadow:0 0 0 2px var(--gold2),0 0 24px rgba(247,200,67,.7);transform:scale(1.04);animation:prizeglow 1.2s ease-in-out infinite}
  @keyframes prizeglow{50%{box-shadow:0 0 0 2px var(--gold1),0 0 38px rgba(247,200,67,1)}}
  .prize.sel .ct{color:#fff}
  .prizes.nudge{animation:nudge .5s}
  @keyframes nudge{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .prizes.locked .prize{cursor:not-allowed}
  .prizes.locked .prize:not(.sel){opacity:.45}
  .row .prize-tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(var(--red1),var(--red2));
    border:1px solid var(--gold2);border-radius:999px;padding:2px 9px}
  .cabinet-wrap{position:relative}

  /* ---------- sign ---------- */
  .sign{position:relative;margin:0 auto -6px;width:78%;height:92px;border-radius:22px 22px 10px 10px;
    background:linear-gradient(var(--red1),var(--red2) 60%,var(--red3));
    border:4px solid var(--gold2);box-shadow:0 0 0 3px var(--gold3),0 0 40px rgba(255,59,78,.45),inset 0 2px 0 rgba(255,255,255,.35);z-index:2}
  .sign-inner{position:absolute;inset:16px 24px;border-radius:12px;background:radial-gradient(ellipse at 50% 30%,#3a0a14,#14030a);
    box-shadow:inset 0 0 18px rgba(0,0,0,.9);display:grid;place-items:center;overflow:hidden}
  .sign-text{font-family:Bungee,sans-serif;font-size:clamp(24px,4vw,38px);letter-spacing:.05em;
    background:linear-gradient(var(--gold1),var(--gold2) 50%,#ff9d1c);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 #6b1500) drop-shadow(0 0 10px rgba(255,200,60,.6))}
  .won .sign-text{animation:signflash .5s steps(2) infinite}
  @keyframes signflash{50%{filter:drop-shadow(0 2px 0 #6b1500) drop-shadow(0 0 26px rgba(255,240,140,1)) brightness(1.4)}}

  /* bulbs */
  .bulbs{position:absolute;inset:0;pointer-events:none;z-index:3}
  .bulb{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,#ffe28a 40%,#d78a00);box-shadow:0 0 8px 2px rgba(255,214,90,.8);
    animation:chase 1.2s infinite}
  .bulb:nth-child(even){animation-delay:.6s}
  @keyframes chase{0%,49%{opacity:1}50%,100%{opacity:.25;box-shadow:none}}
  .spinning .bulb{animation-duration:.28s}.spinning .bulb:nth-child(even){animation-delay:.14s}
  .won .bulb{animation:allflash .35s steps(2) infinite}
  @keyframes allflash{50%{opacity:.2;box-shadow:none}}

  /* ---------- cabinet ---------- */
  .cabinet{position:relative;width:min(780px,calc(100vw - 460px));border-radius:34px 34px 18px 18px;padding:34px 40px 26px;
    background:
      linear-gradient(90deg,rgba(0,0,0,.35),transparent 8%,transparent 92%,rgba(0,0,0,.35)),
      linear-gradient(var(--red1),var(--red2) 45%,var(--red3));
    border:5px solid var(--gold2);
    box-shadow:0 0 0 4px var(--gold3),0 40px 80px -20px rgba(0,0,0,.8),0 0 80px rgba(255,59,78,.25),inset 0 3px 0 rgba(255,255,255,.3)}

  .bay{position:relative;border-radius:20px;padding:14px;
    background:linear-gradient(#1a1a1a,#050505);border:4px solid var(--gold2);
    box-shadow:0 0 0 3px var(--gold3),inset 0 0 30px #000}

  .drum{position:relative;overflow:hidden;border-radius:10px;background:var(--ivory)}
  .drum::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:linear-gradient(rgba(20,0,20,.78),rgba(20,0,20,.25) 22%,rgba(255,255,255,0) 40%,rgba(255,255,255,.1) 50%,rgba(255,255,255,0) 60%,rgba(20,0,20,.25) 78%,rgba(20,0,20,.78))}
  .name-drum{height:calc(var(--itemH) * 3)}
  .strip{will-change:transform}
  .blur .strip{filter:blur(2px)}
  .name-item{height:var(--itemH);display:flex;align-items:center;justify-content:center;padding:0 56px;
    color:var(--ink);font-weight:800;font-size:clamp(24px,3.6vw,40px);letter-spacing:-.01em;white-space:nowrap}
  .name-item span{overflow:hidden;text-overflow:ellipsis}
  .name-item.hit{color:var(--red2);animation:hit .6s ease-out}
  @keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  .name-item.star{color:var(--red2);font-family:Bungee,sans-serif;font-weight:400}

  .payline{position:absolute;left:14px;right:14px;top:calc(14px + var(--itemH));height:var(--itemH);z-index:3;pointer-events:none;
    border-top:2px solid rgba(195,16,43,.55);border-bottom:2px solid rgba(195,16,43,.55);transition:all .3s}
  .payline::before,.payline::after{content:"";position:absolute;top:50%;margin-top:-13px;border:13px solid transparent}
  .payline::before{left:-14px;border-left:18px solid var(--gold2);filter:drop-shadow(0 0 6px var(--gold2))}
  .payline::after{right:-14px;border-right:18px solid var(--gold2);filter:drop-shadow(0 0 6px var(--gold2))}
  .won .payline{border-color:var(--gold2);box-shadow:0 0 24px 4px rgba(247,200,67,.75),inset 0 0 24px rgba(247,200,67,.5);animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 40px 8px rgba(247,200,67,.95),inset 0 0 30px rgba(247,200,67,.7)}}

  .code-bay{display:flex;gap:6px;margin-top:14px;padding:10px;border-radius:16px;align-items:stretch;
    background:linear-gradient(#1a1a1a,#050505);border:3px solid var(--gold2);box-shadow:0 0 0 2px var(--gold3),inset 0 0 20px #000}
  .plate{display:flex;align-items:center;padding:0 14px;border-radius:10px;font-family:Bungee,sans-serif;font-size:clamp(18px,2.6vw,28px);
    color:var(--gold2);background:linear-gradient(#3a0a14,#14030a);text-shadow:0 0 10px rgba(247,200,67,.6)}
  .digit{flex:1;min-width:0;height:calc(var(--digitH) * 1.5);transition:box-shadow .2s}
  .digit .strip div{height:var(--digitH);display:flex;align-items:center;justify-content:center;
    font-family:Bungee,sans-serif;font-size:clamp(24px,3.4vw,38px);color:var(--red2);text-shadow:0 2px 0 rgba(0,0,0,.15)}
  .digit.done{box-shadow:0 0 0 2px var(--gold2),0 0 14px rgba(247,200,67,.7)}

  /* control deck */
  .deck{display:flex;align-items:center;gap:16px;margin-top:18px}
  .lcd{flex:1;min-width:0;height:70px;border-radius:12px;padding:0 18px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    background:linear-gradient(#0b1a12,#03100a);border:3px solid #111;box-shadow:inset 0 0 18px #000,0 0 0 2px var(--gold3);
    font-family:Bungee,sans-serif;color:var(--lime);text-shadow:0 0 8px rgba(125,255,107,.7);letter-spacing:.04em}
  .lcd .l1{font-size:12px;opacity:.75}
  .lcd .l2{font-size:clamp(14px,2vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .won .lcd{color:var(--gold1);text-shadow:0 0 10px rgba(247,200,67,.9)}
  .lights{display:flex;gap:7px}
  .lights i{width:16px;height:28px;border-radius:5px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 10px currentColor;animation:chase 1s infinite}
  .lights i:nth-child(1){background:#ffd23f;color:#ffd23f}.lights i:nth-child(2){background:#3ef0ff;color:#3ef0ff;animation-delay:.25s}
  .lights i:nth-child(3){background:#ff4f6d;color:#ff4f6d;animation-delay:.5s}.lights i:nth-child(4){background:#7dff6b;color:#7dff6b;animation-delay:.75s}
  .spin-btn{width:96px;height:96px;flex:none;border-radius:50%;cursor:pointer;font-family:Bungee,sans-serif;font-size:20px;color:#fff;
    background:radial-gradient(circle at 40% 30%,#ff8a95,var(--red1) 40%,#9d0a22);border:5px solid var(--gold2);
    box-shadow:0 0 0 3px var(--gold3),0 8px 0 #5c0614,0 14px 24px rgba(0,0,0,.5),0 0 30px rgba(255,59,78,.6);
    text-shadow:0 2px 0 #6b0010;transition:transform .08s,box-shadow .08s;margin:-14px 0 -6px}
  .spin-btn:active,.spin-btn.press{transform:translateY(6px);box-shadow:0 0 0 3px var(--gold3),0 2px 0 #5c0614,0 6px 12px rgba(0,0,0,.5),0 0 30px rgba(255,59,78,.6)}
  .spin-btn:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed}

  /* coin tray */
  .tray{margin:18px auto 0;width:70%;height:46px;border-radius:0 0 18px 18px;position:relative;overflow:hidden;
    background:linear-gradient(#050505,#1c1c1c);border:4px solid var(--gold2);border-top-width:6px;box-shadow:0 0 0 3px var(--gold3),inset 0 10px 18px #000}
  .tray i{position:absolute;width:34px;height:22px;border-radius:50%;
    background:radial-gradient(ellipse at 40% 35%,var(--gold1),var(--gold2) 50%,var(--gold3));box-shadow:inset 0 -3px 0 #8a5a00}

  /* ---------- lever ---------- */
  .lever{position:absolute;right:-74px;top:24%;width:70px;height:320px;cursor:grab;touch-action:none;z-index:4}
  .lever.disabled{cursor:not-allowed;filter:grayscale(.6)}
  .mount{position:absolute;left:0;top:132px;width:44px;height:84px;border-radius:6px 22px 22px 6px;
    background:linear-gradient(90deg,var(--gold3),var(--gold1) 45%,var(--gold2) 60%,var(--gold3));box-shadow:0 8px 16px rgba(0,0,0,.5)}
  .arm{position:absolute;left:30px;width:12px;border-radius:6px;
    background:linear-gradient(90deg,#8a8a8a,#fff 45%,#b5b5b5 60%,#6a6a6a);box-shadow:0 4px 8px rgba(0,0,0,.4)}
  .knob{position:absolute;left:12px;width:48px;height:48px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffb3ba,var(--red1) 40%,#7a0012);box-shadow:0 8px 18px -4px rgba(0,0,0,.6),0 0 20px rgba(255,59,78,.5)}
  .lever.snap .arm,.lever.snap .knob{transition:all .55s cubic-bezier(.34,1.56,.64,1)}

  /* drawer */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:30;display:flex;flex-direction:column;
    background:linear-gradient(#2b0f55,#14062a);border-left:3px solid var(--gold2);transform:translateX(105%);transition:transform .35s ease}
  .drawer.open{transform:none;box-shadow:-30px 0 80px rgba(0,0,0,.6)}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid rgba(247,200,67,.25)}
  .drawer-head h2{font-family:Bungee,sans-serif;font-weight:400;font-size:20px;color:var(--gold2)}
  .x{background:none;border:0;font-size:26px;cursor:pointer;color:#cdb8f5;line-height:1}
  .list{flex:1;overflow:auto;padding:6px 0;user-select:text}
  .row{display:grid;grid-template-columns:38px 1fr auto;gap:10px;padding:12px 24px;align-items:center;border-bottom:1px solid rgba(255,255,255,.06)}
  .row .n{font-family:Bungee,sans-serif;font-size:13px;color:var(--gold2)}
  .row .who{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .who em{display:block;font-style:normal;font-size:13px;color:var(--gold1);font-weight:600;margin-top:2px;user-select:all}
  .row .who span{display:block;font-size:12px;color:#b9a6dd;font-weight:500}
  .row code{font-family:Bungee,sans-serif;font-size:12px;color:#ffd9e0}
  .empty{padding:40px 24px;color:#b9a6dd;font-size:14px;text-align:center}
  .drawer-foot{display:flex;gap:10px;padding:16px 24px;border-top:1px solid rgba(247,200,67,.25)}
  .btn{flex:1;font-family:Poppins,sans-serif;font-weight:700;font-size:13px;padding:12px;border-radius:12px;cursor:pointer;border:2px solid var(--gold2)}
  .btn.gold{background:linear-gradient(var(--gold1),var(--gold2));color:#4a2600}
  .btn.ghost{background:transparent;color:#ff8a95;border-color:#ff8a95}
  .scrim{position:fixed;inset:0;background:rgba(5,0,15,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:25}
  .scrim.show{opacity:1;pointer-events:auto}

  .lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(11,4,24,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .lock[hidden]{display:none}
  .lock-card{width:min(380px,100%);text-align:center;padding:34px 28px 28px;border-radius:24px;
    background:linear-gradient(#3a1670,#1c0938);border:3px solid var(--gold2);box-shadow:0 0 0 3px var(--gold3),0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(255,79,216,.25)}
  .lock-logo{font-family:Bungee,sans-serif;font-size:30px;background:linear-gradient(var(--gold1),var(--gold2) 55%,var(--gold3));
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #7a3b00) drop-shadow(0 0 14px rgba(247,200,67,.45))}
  .lock-card p{color:#c9b6ef;font-size:14px;margin:6px 0 20px}
  .lock-card input{width:100%;font-family:Poppins,sans-serif;font-size:16px;padding:13px 16px;border-radius:12px;border:2px solid rgba(247,200,67,.5);
    background:#14062a;color:#fff;outline:none;text-align:center;letter-spacing:.08em;user-select:text}
  .lock-card input:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(247,200,67,.25)}
  .lock-btn{width:100%;margin-top:12px;font-family:Bungee,sans-serif;font-size:17px;padding:13px;border-radius:12px;cursor:pointer;color:#fff;
    background:radial-gradient(circle at 40% 30%,#ff8a95,var(--red1) 45%,#9d0a22);border:3px solid var(--gold2);box-shadow:0 5px 0 #5c0614}
  .lock-btn:disabled{filter:brightness(.8);cursor:wait}
  .lock-err{min-height:20px;margin-top:12px;color:#ff8a95;font-size:13px;font-weight:600}
  .shake{animation:nudge .45s}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}

  @media (max-width:1050px){
    .stage{flex-direction:column;gap:18px}
    .cabinet{width:min(780px,calc(100vw - 160px))}
    .prizes{width:min(780px,calc(100vw - 32px));padding:12px}
    .prizes p{display:none}
    .prize-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .prize{padding:8px 10px}.prize .nm{font-size:13px}.prize:hover{transform:none}.prize.sel{transform:none}
  }
  @media (max-width:760px){
    .prize-list{grid-template-columns:repeat(2,1fr)}.prize .ico{font-size:18px;width:24px}.prize .nm{font-size:12px}
    :root{--itemH:58px;--digitH:46px}
    .cabinet{width:calc(100vw - 24px);padding:22px 22px 18px;border-radius:24px 24px 14px 14px}
    .lever{display:none}
    .sign{width:90%;height:72px}.sign-inner{inset:12px 16px}
    .bay{padding:8px}.payline{left:8px;right:8px;top:calc(8px + var(--itemH))}
    .name-item{padding:0 30px}
    .code-bay{gap:3px;padding:6px}.plate{padding:0 6px}
    .lights{display:none}.spin-btn{width:78px;height:78px;font-size:16px}
    header{padding:12px 14px}.reset-pill span{display:none}.logo{font-size:15px}.pill{font-size:12px;padding:5px 12px}
  }
</style>
</head>
<body>
<div class="sparkles" id="sparkles"></div>
<header>
  <div class="logo">Lucky Draw</div>
  <div class="pills">
    <button class="pill" id="remainingPill" title="Entries still in the draw"><b id="remaining">0</b>in draw</button>
    <button class="pill" id="winnersBtn"><b id="winCount">0</b>winners</button>
    <button class="pill reset-pill" id="resetTop" title="Put everyone back in the draw">↺<span> Reset</span></button>
    <button class="pill icon-pill" id="soundBtn" title="Sound on/off">🔊</button>
  </div>
</header>

<main class="stage">
  <aside class="prizes" id="prizes">
    <h3>Prizes</h3>
    <p>Pick a prize, then spin</p>
    <div class="prize-list" id="prizeList"></div>
  </aside>
  <div class="cabinet-wrap" id="machine">
    <div class="sign">
      <div class="sign-inner"><div class="sign-text" id="signText">JACKPOT</div></div>
      <div class="bulbs" id="signBulbs"></div>
    </div>

    <section class="cabinet" id="cabinet">
      <div class="bulbs" id="cabBulbs"></div>
      <div class="bay" id="bay">
        <div class="drum name-drum" id="nameDrum"><div class="strip" id="nameStrip"></div></div>
        <div class="payline"></div>
      </div>
      <div class="code-bay" id="codeRow"><div class="plate">PBN</div></div>

      <div class="deck">

<script>
window.startApp = () => {
  const ALL = window.ENTRIES || [];             // [name, phone, code]
  const byCode = new Map(ALL.map(e => [e[2], e]));
  const KEY = 'lucky-draw-v1', SKEY = 'lucky-draw-sound';
  const DIGITS = 8;
  const $ = id => document.getElementById(id);

  // ---------- state ----------
  let winners = [];
  try { winners = JSON.parse(localStorage.getItem(KEY) || '[]').filter(w => byCode.has(w.code)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(winners)); } catch (e) {} };
  const pool = () => { const d = new Set(winners.map(w => w.code)); return ALL.filter(e => !d.has(e[2])); };
  const rand = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const pick = arr => arr[rand(arr.length)];

  let itemH, digitH;
  const measure = () => { const s = getComputedStyle(document.documentElement); itemH = parseFloat(s.getPropertyValue('--itemH')); digitH = parseFloat(s.getPropertyValue('--digitH')); };
  measure();

  // ---------- decoration ----------
  const bulb = (el, x, y) => { const b = document.createElement('div'); b.className = 'bulb'; b.style.left = x + 'px'; b.style.top = y + 'px'; el.appendChild(b); };
  function decorate() {
    const sb = $('signBulbs'); sb.replaceChildren();
    const w = sb.clientWidth, h = sb.clientHeight, inset = 7, nx = Math.round((w - 14) / 30);
    for (let i = 0; i <= nx; i++) bulb(sb, inset + (w - 2 * inset) * i / nx, inset);
    for (let i = 1; i < nx; i++) bulb(sb, inset + (w - 2 * inset) * i / nx, h - inset);
    bulb(sb, inset, h / 2); bulb(sb, w - inset, h / 2);
    const cb = $('cabBulbs'); cb.replaceChildren();
    const ch = cb.clientHeight, n = Math.round((ch - 40) / 34);
    for (const x of [18, cb.clientWidth - 18]) for (let j = 0; j <= n; j++) bulb(cb, x, 20 + (ch - 40) * j / n);
    const tray = $('tray'); tray.replaceChildren();
    for (let i = 0; i < 24; i++) { const c = document.createElement('i'); c.style.left = (i * 4.3 - 3) + '%'; c.style.bottom = (-12 + (i % 3) * 7) + 'px'; tray.appendChild(c); }
  }
  const sp = $('sparkles');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
    s.style.color = ['#ff4fd8', '#3ef0ff', '#f7c843', '#ffffff'][i % 4];
    s.style.animationDelay = (Math.random() * 4) + 's'; s.style.animationDuration = (3 + Math.random() * 3) + 's';
    sp.appendChild(s);
  }

  // ---------- sound (synthesised, no files) ----------
  let soundOn = true; try { soundOn = localStorage.getItem(SKEY) !== 'off'; } catch (e) {}
  const setSoundIcon = () => $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  setSoundIcon();
  $('soundBtn').onclick = () => { soundOn = !soundOn; try { localStorage.setItem(SKEY, soundOn ? 'on' : 'off'); } catch (e) {} setSoundIcon(); };
  let ac;
  function tone(freq, dur, type = 'square', vol = .05, delay = 0) {
    if (!soundOn) return;
    try {
      ac ||= new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  const tick = () => tone(1400 + Math.random() * 300, .03, 'square', .025);
  const clunk = () => { tone(180, .12, 'triangle', .12); tone(90, .15, 'sine', .1); };
  const leverSnd = () => { tone(260, .08, 'sawtooth', .04); tone(130, .2, 'triangle', .08, .05); };
  function fanfare() {
    [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'square', .045, i * .11));
    for (let i = 0; i < 18; i++) tone(2200 + Math.random() * 1600, .06, 'triangle', .03, .8 + i * .07); // coin jingle
  }

  // ---------- reels ----------
  const nameStrip = $('nameStrip');
  const digitWins = [], digitStrips = [];
  for (let i = 0; i < DIGITS; i++) {
    const w = document.createElement('div'); w.className = 'drum digit';
    w.innerHTML = '<div class="strip"></div>';
    $('codeRow').appendChild(w); digitWins.push(w); digitStrips.push(w.firstChild);
  }
  const nameEl = (n, cls) => { const d = document.createElement('div'); d.className = 'name-item' + (cls ? ' ' + cls : ''); const s = document.createElement('span'); s.textContent = n; d.appendChild(s); return d; };
  const digEl = v => { const d = document.createElement('div'); d.textContent = v; return d; };

  let spinning = false, nameTop = 0;
  function setIdle() {
    const p = pool(), src = p.length ? p : ALL;
    nameStrip.style.transition = 'none'; nameStrip.style.transform = 'translateY(0)'; nameTop = 0;
    nameStrip.replaceChildren(nameEl(pick(src)[0]), nameEl(p.length ? '★ 777 ★' : 'All drawn!', 'star'), nameEl(pick(src)[0]));
    digitStrips.forEach(s => {
      s.style.transition = 'none'; s.style.transform = `translateY(${-digitH * .75}px)`;
      s.replaceChildren(digEl(rand(10)), digEl('7'), digEl(rand(10)));
    });
  }

  const PRIZES = [
    ['✈️', 'Ticket to India'],
    ['🏝️', 'Trip to Mexico'],
    ['🪙', '1GM Gold Coin'],
    ['📺', '55" LED Screen'],
    ['☕', '$50 Almond Cafe Voucher'],
    ['🍛', '$50 Punjabi By Nature Voucher'],
  ];
  let prize = null;
  function renderPrizes() {
    $('prizeList').replaceChildren(...PRIZES.map(([ico, nm]) => {
      const b = document.createElement('button'); b.className = 'prize' + (nm === prize ? ' sel' : '');
      b.innerHTML = '<span class="ico"></span><span class="nm"></span>';
      b.children[0].textContent = ico; b.children[1].textContent = nm;
      b.onclick = () => {
        if (spinning) return;
        prize = nm; renderPrizes(); tone(880, .08, 'triangle', .05);
        $('machine').classList.remove('won'); $('signText').textContent = 'JACKPOT';
        lcd('Prize: ' + nm, 'Pull the lever!');
      };
      return b;
    }));
    $('prizes').classList.toggle('locked', spinning);
  }
  function needPrize() {
    if (prize) return false;
    lcd('Choose a prize', 'Pick a prize first!');
    const el = $('prizes'); el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge');
    tone(200, .15, 'square', .05);
    return true;
  }

  function lcd(a, b) { $('lcd1').textContent = a; $('lcd2').textContent = b; }

  function updateCounts() {
    $('remaining').textContent = (ALL.length - winners.length).toLocaleString();
    $('winCount').textContent = winners.length.toLocaleString();
    const out = winners.length >= ALL.length;
    $('lever').classList.toggle('disabled', out); $('spinBtn').disabled = out;
    renderList(); renderPrizes();
  }

  function spin() {
    if (spinning) return;
    const p = pool();
    if (!p.length) { lcd('Game over', 'Everyone has been drawn'); return; }
    if (needPrize()) return;
    spinning = true;
    const winner = pick(p);
    winners.push({ code: winner[2], t: Date.now(), prize }); save();   // commit now so a reload can't redraw
    const m = $('machine'); m.classList.remove('won'); m.classList.add('spinning');
    $('signText').textContent = 'JACKPOT';
    lcd('Spinning for ' + prize, 'Good luck…');
    $('spinBtn').classList.add('press'); setTimeout(() => $('spinBtn').classList.remove('press'), 160);
    digitWins.forEach(d => d.classList.remove('done'));

    // name reel
    const N = 120;
    const current = [...nameStrip.children].slice(nameTop, nameTop + 3).map(c => c.firstChild.textContent);
    const items = [];
    for (let i = 0; i < N; i++) items.push(nameEl(pick(ALL)[0]));
    items.push(nameEl(winner[0]), nameEl(pick(ALL)[0]));
    nameStrip.style.transition = 'none';
    nameStrip.replaceChildren(...current.map(t => nameEl(t)), ...items);
    nameStrip.style.transform = 'translateY(0)';
    nameStrip.getBoundingClientRect();
    nameTop = current.length + N - 1;
    const nameDur = 10500;
    nameStrip.style.transition = `transform ${nameDur}ms cubic-bezier(.08,.55,.06,1)`;
    nameStrip.style.transform = `translateY(${-nameTop * itemH}px)`;
    $('nameDrum').classList.add('blur'); setTimeout(() => $('nameDrum').classList.remove('blur'), nameDur * .45);
    setTimeout(() => { if (spinning) lcd('Almost there', 'Who will it be…?'); }, nameDur * .6);

    // tick each time a name passes the payline
    let last = 0;
    const t0 = performance.now();
    (function watch() {
      const y = -new DOMMatrixReadOnly(getComputedStyle(nameStrip).transform).m42;
      const idx = Math.floor(y / itemH);
      if (idx !== last) { last = idx; tick(); }
      if (performance.now() - t0 < nameDur) requestAnimationFrame(watch);
    })();

    // digit reels, stopping left → right
    const digits = winner[2].slice(3).split('');
    digitStrips.forEach((s, i) => {
      const count = 40 + i * 8, nodes = [];
      for (let k = 0; k < count; k++) nodes.push(digEl(rand(10)));
      s.style.transition = 'none'; s.style.transform = `translateY(${-digitH * .25}px)`;
      s.replaceChildren(...nodes, digEl(digits[i]), digEl(rand(10)));
      s.getBoundingClientRect();
      const dur = 3200 + i * 650;
      s.style.transition = `transform ${dur}ms cubic-bezier(.2,.7,.15,1.04)`;
      s.style.transform = `translateY(${-(count * digitH) + digitH * .25}px)`;
      setTimeout(() => { clunk(); digitWins[i].classList.add('done'); }, dur);
    });

    setTimeout(() => reveal(winner), nameDur + 100);
    updateCounts();
  }

  function reveal(w) {
    spinning = false;
    const m = $('machine'); m.classList.remove('spinning'); m.classList.add('won');
    $('signText').textContent = 'WINNER!';
    nameStrip.children[nameTop + 1]?.classList.add('hit');
    lcd('★ Wins ' + prize + ' ★', w[0] + '  ·  ' + w[2]);
    renderPrizes();
    clunk(); fanfare(); celebrate();
  }

  // ---------- lever ----------
  const lever = $('lever'), arm = $('arm'), knob = $('knob');
  const PIVOT = 174, KNOB = 48;   // pivot y (centre of mount), knob size
  const range = () => lever.clientHeight - KNOB;
  function setLever(f) {          // 0 = up, 1 = pulled down
    const y = f * range(), c = y + KNOB / 2;
    knob.style.top = y + 'px';
    arm.style.top = Math.min(c, PIVOT) + 'px';
    arm.style.height = Math.abs(PIVOT - c) + 'px';
  }
  setLever(0);
  let drag = null;
  lever.addEventListener('pointerdown', e => {
    if (spinning || winners.length >= ALL.length) return;
    lever.classList.remove('snap'); lever.setPointerCapture(e.pointerId);
    drag = { y: e.clientY, moved: false, f: 0 }; lever.style.cursor = 'grabbing';
  });
  lever.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.f = Math.min(1, Math.max(0, (e.clientY - drag.y) / range()));
    if (drag.f > .05) drag.moved = true;
    setLever(drag.f);
  });
  const release = () => {
    if (!drag) return;
    const fire = drag.f > .5 || !drag.moved;
    drag = null; lever.style.cursor = '';
    if (fire) pull(); else { lever.classList.add('snap'); setLever(0); }
  };
  lever.addEventListener('pointerup', release);
  lever.addEventListener('pointercancel', release);

  function pull() {
    if (spinning) return;
    if (winners.length >= ALL.length) return spin();
    if (needPrize()) { lever.classList.add('snap'); setLever(0); return; }
    leverSnd();
    lever.classList.add('snap'); setLever(1);
    setTimeout(() => { spin(); setLever(0); }, 280);
  }
  $('spinBtn').onclick = pull;
  addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && !$('drawer').classList.contains('open')) { e.preventDefault(); pull(); }
    if (e.code === 'Escape') closeDrawer();
  });

  // ---------- winners drawer ----------
  const openDrawer = () => { $('drawer').classList.add('open'); $('scrim').classList.add('show'); };
  const closeDrawer = () => { $('drawer').classList.remove('open'); $('scrim').classList.remove('show'); };
  $('winnersBtn').onclick = openDrawer; $('remainingPill').onclick = openDrawer;
  $('closeDrawer').onclick = closeDrawer; $('scrim').onclick = closeDrawer;

  const fmtPhone = p => { const d = String(p).replace(/\D/g, '');
    return d.length === 11 && d[0] === '1' ? `+1 (${d.slice(1, 4)}) ${d.slice(4, 7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : p; };
  function renderList() {
    const list = $('list');
    if (!winners.length) { list.innerHTML = '<div class="empty">No winners yet — pull the lever!</div>'; return; }
    list.replaceChildren(...winners.map((w, i) => {
      const e = byCode.get(w.code);
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = '<div class="n"></div><div class="who"></div><code></code>';
      r.children[0].textContent = i + 1;
      r.children[1].textContent = e[0];
      const ph = document.createElement('em'); ph.textContent = '📞 ' + fmtPhone(e[1]);
      const sub = document.createElement('span');
      sub.textContent = new Date(w.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      r.children[1].append(ph, sub);
      if (w.prize) { const pt = document.createElement('div'); pt.className = 'prize-tag'; pt.textContent = '🏆 ' + w.prize; r.children[1].append(pt); }
      r.children[2].textContent = e[2];
      return r;
    }).reverse());
  }

  $('exportBtn').onclick = () => {
    const q = s => `"${String(s).replace(/"/g, '""')}"`;
    const lines = [['#', 'Full Name', 'Mobile Number', 'Unique Code', 'Prize', 'Drawn At'].map(q).join(',')];
    winners.forEach((w, i) => { const e = byCode.get(w.code); lines.push([i + 1, e[0], e[1], e[2], w.prize || '', new Date(w.t).toLocaleString()].map(q).join(',')); });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
    a.download = 'lucky-draw-winners.csv'; a.click();
  };
  const resetAll = () => {
    if (spinning) return;
    if (!winners.length) { lcd('Lucky draw', 'Nothing to reset'); return; }
    if (!confirm(`Put all ${winners.length} winners back into the draw? This clears the winners list.`)) return;
    winners = []; save(); updateCounts(); setIdle();
    $('machine').classList.remove('won'); $('signText').textContent = 'JACKPOT'; lcd('Lucky draw', 'Pull the lever!');
  };
  $('resetBtn').onclick = resetAll; $('resetTop').onclick = resetAll;

  // ---------- coins + confetti ----------
  const cv = $('fx'), ctx = cv.getContext('2d'); let parts = [], raf;
  const fit = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; };
  fit();
  function celebrate() {
    const D = devicePixelRatio, r = $('bay').getBoundingClientRect();
    const cols = ['#ff4fd8', '#3ef0ff', '#7dff6b', '#ff3b4e', '#f7c843', '#ffffff'];
    for (let i = 0; i < 90; i++) parts.push({ coin: true, x: (r.left + r.width / 2) * D, y: (r.top + r.height / 2) * D,
      vx: (Math.random() - .5) * 30, vy: -Math.random() * 26 - 8, g: .7, s: (Math.random() * 8 + 14) * D, a: Math.random() * 6, va: Math.random() * .25 + .05, life: 0 });
    for (let i = 0; i < 160; i++) parts.push({ x: Math.random() * cv.width, y: -Math.random() * cv.height * .4,
      vx: (Math.random() - .5) * 4, vy: Math.random() * 4 + 3, g: .05, s: (Math.random() * 6 + 5) * D, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[i % cols.length], life: 0 });
    cancelAnimationFrame(raf); frame();
  }
  function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life < 260 && p.y < cv.height + 60);
    for (const p of parts) {
      p.life++; p.vx *= .99; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha = Math.min(1, (260 - p.life) / 40);
      if (p.coin) {
        const w = Math.abs(Math.cos(p.a)) * p.s / 2 + 1;   // spinning coin
        const g = ctx.createRadialGradient(-w / 3, -p.s / 6, 1, 0, 0, p.s / 2);
        g.addColorStop(0, '#fff1a8'); g.addColorStop(.55, '#f7c843'); g.addColorStop(1, '#a8700f');
        ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, w, p.s / 2, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 1.5 * devicePixelRatio; ctx.stroke();
      } else {
        ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      }
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  }

  // ---------- init ----------
  addEventListener('resize', () => { fit(); measure(); decorate(); setLever(0); if (!spinning) setIdle(); });
  document.fonts?.ready.then(decorate);
  decorate(); setIdle(); updateCounts();
};
</script>

<div class="lock" id="lock" hidden>
  <form class="lock-card" id="lockForm" autocomplete="off">
    <div class="lock-logo">Lucky Draw</div>
    <p>Enter the password to start</p>
    <input type="password" id="lockPw" placeholder="Password" autofocus>
    <button type="submit" class="lock-btn" id="lockBtn">Unlock</button>
    <div class="lock-err" id="lockErr"></div>
  </form>
</div>
<script>
(async () => {
  const E = window.ENC;
  if (!E) { window.startApp(); return; }           // local copy with the list built in
  const lock = document.getElementById('lock'), form = document.getElementById('lockForm');
  const pwEl = document.getElementById('lockPw'), err = document.getElementById('lockErr'), btn = document.getElementById('lockBtn');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decrypt(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(E.salt), iterations: E.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(E.iv) }, key, b64(E.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function tryOpen(pw, quiet) {
    try {
      window.ENTRIES = await decrypt(pw);
      try { sessionStorage.setItem('lucky-draw-pw', pw); } catch (e) {}
      lock.hidden = true; window.startApp(); return true;
    } catch (e) {
      if (!quiet) { err.textContent = 'Wrong password — try again'; form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); pwEl.select(); }
      return false;
    }
  }
  let saved = null; try { saved = sessionStorage.getItem('lucky-draw-pw'); } catch (e) {}
  if (saved && await tryOpen(saved, true)) return;
  lock.hidden = false; pwEl.focus();
  form.addEventListener('submit', async e => {
    e.preventDefault(); if (!pwEl.value) return;
    btn.disabled = true; btn.textContent = 'Checking…'; err.textContent = '';
    await tryOpen(pwEl.value);
    btn.disabled = false; btn.textContent = 'Unlock';
  });
})();
</script>
</body>
</html>
